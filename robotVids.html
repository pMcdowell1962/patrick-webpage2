  <h1>Videos of old robots that I built or worked on</h1>

  <p>
    <h2>LSU RoboKitty Early Walking Experiment</h2>
    <figure>
      <video width="640" controls>
        <source src="learning-to-walk-early-robotiger.mp4" type="video/mp4">
      </video>
      <figcaption>
        This video shows the robo kitty, a project that I worked on at LSU in the early 2000's, while working in the old Robotics Research Lab (RRL) 
        in Coates hall.  I had built this "cat" robot using RC servo's and a small control board.  My intention was for it to "learn" how to walk, and my
        idea was to use a genetic algorithm.  I had done this in simulation during my masters degree to train some neural networks to control a 3 legged
        "bug" and it worked.  Well, simulation and physical equipment are different in many ways; the time and physical toll on the robot being the key
        differences.  Of course I was not aware of this then, but a few hundred robot walks, breeding, ranking etc. it was apparent.  This video shows
        some of the later results.  The walking distance of the robot actually grew by about double, but still, we had to switch to a different method before
        we broke the robot.
      </figcaption>
    </figure>
