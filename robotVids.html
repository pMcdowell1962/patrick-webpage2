  <h1>Videos of old robots that I built or worked on</h1>

  <p>
    <h2>LSU RoboKitty - Early Walking Experiment</h2>
    <figure>
      <video width="640" controls>
        <source src="learning-to-walk-early-robotiger.mp4" type="video/mp4">
      </video>
      <figcaption>
        <p>This video shows the robo kitty, a project that I worked on at LSU in the early 2000's, while working in the old Robotics Research Lab (RRL) 
        in Coates hall at the LSU Baton Rouge campus.</p>
        
        <p>At Dr. S.S Iyengar's bidding, I designed (loose use of that word) and built this "cat" robot using RC servo's and a small control board.  My intention was for it to "learn" how to walk, and my
        idea to accomplish this was to use a genetic algorithm (GA).  I had done this in simulation during my masters degree to train some neural networks to control a 3 legged
        "bug" and it worked.</p>
        
        <p>Well, simulation and physical equipment are different in many ways; the time and physical toll on the robot being the key
        differences.  Of course I was not aware of this then, but after a few hundred robot walks, breeding, ranking etc. it was apparent.  This video shows
        some of the later results.  The walking distance of the robot actually grew by about double, but still, we had to switch to a different method before
        we broke the robot.</p>
        
      </figcaption>
    </figure>
  <p>

  <p>
    <h2>LSU RoboKitty - Later Walking Experiments</h2>
    <figure>
      <video width="640" controls>
        <source src="robokitty-walk.mp4" type="video/mp4">
      </video>
      <video width="640" controls>
        <source src="robokitty-and-mitzy.mp4" type="video/mp4">
      </video>
      <figcaption>
        <p>The videos show the robo kitty walking using gait control and leg movement software. The system worked using LabView software generating
        control signals which were sent out the RS232 port of the computer to SSC-32 servo controller.</p>
        
        <p>This is the same robot, and servo control system as 
        used in the earlier experiments, however the new software control was much quicker and less detrimental to the robot's locomotion hardware.  In the 
        second video you can Mitzy (siamese cat) coming to check out the robot.</p>
        
      </figcaption>
    </figure>
  <p>

  <p>
    <h2>Naval Research Lab, Stennis Ms - Robot Formation Maneuvering Experiments</h2>
    <figure>
      <video width="640" controls>
        <source src="nrl-roboline-acoustic-following.mp4" type="video/mp4">
      </video>
      <video width="640" controls>
        <source src="nrl-tracking-system-short.mp4" type="video/mp4">
      </video>
      <figcaption>
        <p>These videos the first stages of robot formation maneuvering experiments conducted at NRL by myself, Dr. Brian Bourgeois, Marvin Roe, and Don Brandon. We also had
        excellent help from Josh Miceli, Dustin Marmalich, John "Kerry" Herrington, and others. </p>
        
        <p>Our goal was to use relative positioning to widen the sensor footprint of autonmous robots.  There was to be a lead robot, with followers whose purpose was to extend
        the sensing capability of the leader.  The end goal was to use this system underwater, thus the acoustic tracking.</p>  
        
        <p>The robots detect each other by sensing an
        acoustic chirp (clearly audible in the first video) and following it.  Each robot followed a chirp in an assigned frequency band.  In the lab environment, the 
        severe echoing made it a difficult proposition, but the chirping worked.  The system was tested outside also, and its performance was markedly better.</p>

        <p>The second video shows the tracking software used.  It was developed so that robot's following performance could be measured.  </p>

        <p>All of this work was done at Stennis Space Center Ms. for NRL in the early 2000's</p>
        
      </figcaption>
    </figure>
      <video width="640" controls>
        <source src="nrl-pool-test3-2.mp4" type="video/mp4">
      </video>
      <figcaption>
        <p>This video shows testing of the development of the next stage of the formation maneuvering project, water based vehicles.  The acoustics for the land
        systems was refined well enough for it work, so it was decided that we needed to take the next step.</p>
        
        <p>Model boats were selected to be the water
        "robots".  Much work was put into this, including fitting the robots with PC based computer systems, working with hydrophones, etc., but in the 
        end the electronic interference in the small confines of the boat model proved to be a daunting problem that was not solved to my knowledge.</p>
        
      </figcaption>
    <figure>
      
    </figure>
  </p>

    <h2>Southeastern Louisiana University - Robot Hockey</h2>
    <figure>
      <video width="640" controls>

      </video>
      <video width="640" controls>
        <source src="SLU-improved-hockey.mp4" type="video/mp4">
      </video>
      <figcaption>
        <p>Although seemingly unlrelated, I was still focused on learning limb control.  The hockey system was limb control, but no balance; an easier problem for 
        sure, however depending on how quick the puck is moving, success can be elusive.</p>
        
        <p>Several students worked on this project.  Dan Reid and Robert Chaney made large contributions to the project; Matt Lakin's hard work was key to its success, he is in the video on the left.  
          The video on the right shows some improvement in the tracking and control systems.</p>

        <p> This work started in around 2007 and continued for some time. </p>
        
      </figcaption>
    </figure>
